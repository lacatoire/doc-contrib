# https://docs.github.com/en/actions

name: "DocBook Lint"

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docbook-cs:
    name: "Build & Lint"
    runs-on: "ubuntu-latest"

    env:
      BASE_SHA: |-
        ${{
          case(
            github.event_name == 'pull_request', github.event.pull_request.base.sha,
            github.event_name == 'push', github.event.before,
            'INVALID'
          )
        }}

    steps:
      - name: "Checkout doc-contrib as the language directory"
        uses: "actions/checkout@v7"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          path: "en"
          fetch-depth: 50

      # TODO: switch to php/doc-base master once third-party manual support
      # (php/doc-base#324) is merged, planned for July 31.
      - name: "Checkout doc-base"
        uses: "actions/checkout@v7"
        with:
          path: "doc-base"
          repository: "alfsb/doc-base"
          ref: "third-party-ext"

      - name: "Checkout php/docbook-cs"
        uses: "actions/checkout@v7"
        with:
          path: "docbook-cs"
          repository: "php/docbook-cs"

      - name: "Resolve diff base"
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "BASE_SHA=4b825dc642cb6eb9a060e54bf8d69288fbee4904" >> "$GITHUB_ENV"
            echo "INITIAL_PUSH=true" >> "$GITHUB_ENV"
          fi

      - name: "Fetch diff base"
        if: ${{ env.INITIAL_PUSH != 'true' }}
        working-directory: "en"
        run: |
          git fetch origin "$BASE_SHA" --depth=50
          for i in 1 2 3 4 5; do
            git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1 && break
            git fetch --deepen=100 origin "$BASE_SHA"
          done

      - name: "Setup PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          extensions: "dom, libxml, simplexml"
          tools: composer, cs2pr

      # Building generates temp/entities.ent, which docbookcs.xml loads so the
      # linter can resolve this manual's own entities (e.g. main-manual.ent).
      - name: "Build documentation"
        run: |
          php doc-base/configure.php \
            --disable-libxml-check \
            --enable-xml-details \
            --redirect-stderr-to-stdout \
            --with-lang=en

      - name: "Install docbook-cs"
        working-directory: "docbook-cs"
        run: composer install --no-interaction --no-progress

      - name: "Run docbook-cs on diff"
        working-directory: "en"
        run: |
          set -o pipefail
          if [ "$INITIAL_PUSH" = "true" ]; then
            git diff "$BASE_SHA" HEAD
          else
            git diff "$BASE_SHA"...HEAD
          fi | php ../docbook-cs/bin/docbook-cs \
            --report=checkstyle \
            --diff \
            --no-colors > docbook-report.xml

      - name: "Upload report"
        if: ${{ ! cancelled() }}
        uses: "actions/upload-artifact@v7"
        with:
          name: "docbook-report"
          path: "en/docbook-report.xml"

      - name: "Annotate PR with violations"
        if: ${{ ! cancelled() }}
        working-directory: "en"
        run: cs2pr docbook-report.xml --colorize --prepend-filename
